# SPDX-License-Identifier: MPL-2.0

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew checkAll
      - name: Verify configuration cache reuse
        run: ./gradlew checkAll
      - name: Train AOT cache
        run: ./gradlew :cli-jvm:aotTrain
      - name: Exercise AOT cache
        run: |
          executable_jar=$(realpath cli-jvm/build/libs/glow-adoc-*-app.jar)
          "$executable_jar" --timings --no-cache --no-pager --color=always fixtures/showcase.adoc 2> cli-jvm/build/aot-check.log
          grep 'timing aot-cache:' cli-jvm/build/aot-check.log
          selected_java=$(sed -n 's/^glow-adoc timing java: //p' cli-jvm/build/aot-check.log)
          aot_cache=$(sed -n 's/^glow-adoc timing aot-cache: //p' cli-jvm/build/aot-check.log)
          "$selected_java" --sun-misc-unsafe-memory-access=allow -XX:+UnlockDiagnosticVMOptions -XX:+AOTCompatibleOopCompression -XX:AOTMode=required -XX:AOTCache="$aot_cache" -jar "$executable_jar" --no-cache --no-pager --color=always fixtures/showcase.adoc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: '**/build/reports/'
  merman:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Fetch pinned Merman release
        working-directory: ${{ runner.temp }}
        run: |
          curl -fSL https://github.com/Latias94/merman/releases/download/v0.8.0/merman-cli-x86_64-unknown-linux-gnu.tar.xz -o merman.tar.xz
          echo '005211cfdac64eaab4dc338b03ecc3d973c76869e3f949166ddd09d78368abc0  merman.tar.xz' | sha256sum --check
          tar -xf merman.tar.xz
      - run: ./gradlew :diagrams:test
        env:
          GLOW_TEST_MERMAN: ${{ runner.temp }}/merman-cli-x86_64-unknown-linux-gnu/merman-cli
