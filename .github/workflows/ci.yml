# SPDX-License-Identifier: MPL-2.0

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew checkAll
      - name: Verify configuration cache reuse
        run: ./gradlew checkAll
      - name: Install packaged AOT cache
        run: ./gradlew :glowadoc-cli-jvm:install
      - name: Exercise AOT cache
        run: |
          installed_jar="${XDG_DATA_HOME:-$HOME/.local/share}/glow-adoc/glow-adoc.jar"
          "$HOME/.local/bin/glow-adoc" --timings --no-cache --no-pager --color=always fixtures/showcase.adoc 2> glowadoc-cli-jvm/build/aot-check.log
          grep 'timing aot-cache:' glowadoc-cli-jvm/build/aot-check.log
          selected_java=$(sed -n 's/^glow-adoc timing java: //p' glowadoc-cli-jvm/build/aot-check.log)
          aot_cache=$(sed -n 's/^glow-adoc timing aot-cache: //p' glowadoc-cli-jvm/build/aot-check.log)
          "$selected_java" -XX:+UnlockDiagnosticVMOptions -XX:+AOTCompatibleOopCompression -XX:AOTMode=required -XX:AOTCache="$aot_cache" -jar "$installed_jar" --no-cache --no-pager --color=always fixtures/showcase.adoc
      - name: Upload distribution with AOT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glow-adoc-${{ matrix.os }}
          path: |
            glowadoc-cli-jvm/build/distributions/glow-adoc-*.zip
            !glowadoc-cli-jvm/build/distributions/*-without-aot.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload distribution without AOT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glow-adoc-without-aot-${{ matrix.os }}
          path: glowadoc-cli-jvm/build/distributions/*-without-aot.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload tested application classes and resources
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glowadoc-tested-classes
          path: |
            **/build/classes/java/main/
            **/build/resources/main/
            glowadoc-cli-jvm/build/classes/java/bootstrap/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: '**/build/reports/'
  merman:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Fetch pinned Merman release
        working-directory: ${{ runner.temp }}
        run: |
          curl -fSL https://github.com/Latias94/merman/releases/download/v0.8.0/merman-cli-x86_64-unknown-linux-gnu.tar.xz -o merman.tar.xz
          echo '005211cfdac64eaab4dc338b03ecc3d973c76869e3f949166ddd09d78368abc0  merman.tar.xz' | sha256sum --check
          tar -xf merman.tar.xz
      - run: ./gradlew :glowadoc-diagrams-merman:test
        env:
          GLOW_TEST_MERMAN: ${{ runner.temp }}/merman-cli-x86_64-unknown-linux-gnu/merman-cli
  draft:
    needs: [build, merman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de
      - name: Verify release lifecycle
        run: jbang tools/Release.java --self-test
      - name: Select newest draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jbang tools/Release.java select
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.draft.outputs.id != ''
      - name: Download tested application classes and resources
        if: steps.draft.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glowadoc-tested-classes
          path: .
      - name: Package tested classes with the draft version
        if: steps.draft.outputs.id != ''
        env:
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
          ORG_GRADLE_PROJECT_releaseTag: ${{ steps.draft.outputs.tag }}
          ORG_GRADLE_PROJECT_releasePrerelease: ${{ steps.draft.outputs.prerelease }}
        run: |
          git tag --no-sign "$RELEASE_TAG" "$GITHUB_SHA"
          ./gradlew :glowadoc-cli-jvm:releaseArtifacts -x compileJava -x :glowadoc-cli-jvm:compileBootstrapJava
      - name: Check draft before updating
        if: steps.draft.outputs.id != ''
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
          PRERELEASE: ${{ steps.draft.outputs.prerelease }}
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            const {data: draft} = await github.rest.repos.getRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID)
            });
            const {data: refs} = await github.rest.git.listMatchingRefs({
              ...context.repo, ref: `tags/${process.env.RELEASE_TAG}`
            });
            if (branch.commit.sha !== context.sha || !draft.draft ||
                draft.tag_name !== process.env.RELEASE_TAG ||
                String(draft.prerelease) !== process.env.PRERELEASE ||
                refs.some(r => r.ref === `refs/tags/${process.env.RELEASE_TAG}`)) {
              return core.notice('Build, draft or tag changed; skipped draft update.');
            }
            core.setOutput('ready', 'true');
      - name: Update and verify selected draft release
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: jbang tools/Release.java draft glowadoc-cli-jvm/build/release
