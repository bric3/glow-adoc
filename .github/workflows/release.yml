# SPDX-License-Identifier: MPL-2.0

name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild (v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_releaseTag: ${{ github.event.release.tag_name || inputs.tag }}
      ORG_GRADLE_PROJECT_releasePrerelease: ${{ github.event_name == 'release' && toJSON(github.event.release.prerelease) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de
      - name: Build and verify artifacts
        run: ./gradlew checkAll :glowadoc-cli-jvm:releaseArtifacts
      - name: Verify release lifecycle
        run: jbang tools/Release.java --self-test
      - name: Update and verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: jbang tools/Release.java final glowadoc-cli-jvm/build/release
