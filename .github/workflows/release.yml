# SPDX-License-Identifier: MPL-2.0

name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew checkAll -Pversion="${RELEASE_TAG#v}"
      - name: Generate checksums
        run: sha256sum cli-jvm/build/libs/*.jar > checksums.txt
      - name: Create draft for manual publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md cli-jvm/build/libs/*.jar checksums.txt
