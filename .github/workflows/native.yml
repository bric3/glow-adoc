# SPDX-License-Identifier: MPL-2.0

name: Native Image feasibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: '27'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :glowadoc-cli-native:nativeCompile
      - run: glowadoc-cli-native/build/native/glow-adoc --no-pager --color=never fixtures/showcase.adoc
