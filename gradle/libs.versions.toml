[versions]
asciidoctor = "3.0.1"
jruby = { strictly = "10.1.2.0" }
aesh = "3.18.6"
tamboui = "0.6.0"
lumis = "0.0.10"
plantuml = "1.2026.9"
traceur-ditaa = "0.1.0"
tomlj = "2.2.0"
junit = "6.1.3"
jsoup = "1.23.2"
snakeyaml = "2.7"
jsvg = "2.2.0"
spotless = "8.10.4"
prince-of-space = "2.3.1"
tabletest = "1.2.2"
tabletest-formatter = "1.1.3"
yumi-licenser = "4.0.0"
ktlint = "1.8.0"

[libraries]
asciidoctor = { module = "org.asciidoctor:asciidoctorj", version.ref = "asciidoctor" }
jruby-runtime = { module = "org.jruby:jruby", version.ref = "jruby" }
jruby-base = { module = "org.jruby:jruby-base", version.ref = "jruby" }
jruby-stdlib = { module = "org.jruby:jruby-stdlib", version.ref = "jruby" }
aesh = { module = "org.aesh:aesh", version.ref = "aesh" }
aesh-processor = { module = "org.aesh:aesh-processor", version.ref = "aesh" }
tamboui-tui = { module = "dev.tamboui:tamboui-tui", version.ref = "tamboui" }
tamboui-aesh = { module = "dev.tamboui:tamboui-aesh-backend", version.ref = "tamboui" }
lumis = { module = "io.roastedroot:lumis4j", version.ref = "lumis" }
plantuml = { module = "net.sourceforge.plantuml:plantuml-mit", version.ref = "plantuml" }
traceur-ditaa = { module = "io.github.bric3.traceur:traceur-ditaa", version.ref = "traceur-ditaa" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }
tabletest = { module = "org.tabletest:tabletest-junit", version.ref = "tabletest" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
yumi-licenser-gradle = { module = "dev.yumi:yumi-gradle-licenser", version.ref = "yumi-licenser" }
